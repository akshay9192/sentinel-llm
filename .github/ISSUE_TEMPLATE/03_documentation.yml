name: Documentation improvement
description: Report a Sentinel LLM documentation problem
title: "[DOCS]: "
labels: [documentation]
body:
  - type: input
    id: file
    attributes:
      label: Affected file or link
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Describe the inaccurate, missing, or confusing content and the affected commit.
    validations:
      required: true
