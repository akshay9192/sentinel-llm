name: Feature suggestion
description: Suggest a Sentinel LLM roadmap improvement
title: "[FEAT]: "
labels: [enhancement, feature request]
body:
  - type: markdown
    attributes:
      value: |
        Search existing Sentinel issues and PROJECT_PLAN.md first. Planned work
        cannot bypass the current phase review gate.
  - type: textarea
    id: description
    attributes:
      label: What would you like to see?
      description: Describe the capability, use case, and relationship to the Sentinel roadmap.
    validations:
      required: true
  - type: textarea
    id: security
    attributes:
      label: Security and upstream impact
      description: Explain trust-boundary, upstream-compatibility, and local-first implications where relevant.
    validations:
      required: false
