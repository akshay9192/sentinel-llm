name: Bug report
description: Report a reproducible Sentinel LLM defect
title: "[BUG]: "
labels: [possible bug]
body:
  - type: markdown
    attributes:
      value: |
        Use this template for Sentinel LLM. State whether the defect concerns
        Sentinel-specific work or the preserved AnythingLLM foundation. Do not
        include vulnerability details here; use SECURITY.md instead.
  - type: input
    id: commit
    attributes:
      label: Sentinel commit
      description: Provide the exact output of `git rev-parse HEAD`.
    validations:
      required: true
  - type: dropdown
    id: runtime
    attributes:
      label: How are you running the repository?
      description: Select the environment that best represents the failing Sentinel commit.
      options:
        - Docker (local)
        - Docker (remote machine)
        - Local development
        - Upstream AnythingLLM desktop app
        - Not listed
      default: 0
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the observed and expected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Provide the smallest deterministic reproducer and relevant logs with secrets removed.
    validations:
      required: false
  - type: textarea
    id: model-runtime
    attributes:
      label: Local model runtime (if applicable)
      description: Record the Ollama version and exact model tags involved.
      placeholder: "Ollama 0.x / llama3.2:3b"
    validations:
      required: false
